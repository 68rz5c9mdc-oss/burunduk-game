<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#222"><title>Бурундук и орешки</title>
<style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}body{margin:0;background:#222;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh}.game{width:min(100vw,760px);background:#e8d8b8;border:9px solid #a52d22;border-radius:22px;padding:12px;box-shadow:inset 0 0 0 4px #6f211a}h1{margin:0 0 8px;text-align:center;color:#a52d22;font-size:clamp(20px,5vw,34px)}.screen{position:relative;height:min(55dvh,440px);min-height:320px;background:linear-gradient(#b9d9b1,#8fb79b);border:8px solid #302f28;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 18px #596050}.hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font:700 18px monospace;color:#1c241c;z-index:5}.lane{position:absolute;width:45%;height:4px;background:#354035;opacity:.55}.l1{left:0;top:20%;transform:rotate(14deg)}.l2{right:0;top:20%;transform:rotate(-14deg)}.l3{left:0;top:72%;transform:rotate(-14deg)}.l4{right:0;top:72%;transform:rotate(14deg)}.nut{position:absolute;font-size:38px;filter:saturate(1.25) contrast(1.1);z-index:3}.squirrel{position:absolute;font-size:72px;left:43%;top:39%;transform:translate(-50%,-50%);filter:saturate(1.2) contrast(1.08);transition:left .06s,top .06s,transform .06s;z-index:2}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:bold 25px monospace;color:#202820;background:#aab19acc;z-index:10}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:12px;align-items:center;margin-top:14px}.side{display:grid;gap:12px}button{border:0;-webkit-tap-highlight-color:transparent}.red{height:70px;border-radius:50%;background:#bd382b;border:5px solid #68221c;box-shadow:0 5px 0 #3e1714;color:white;font-size:27px;font-weight:bold}.red:active{transform:translateY(4px);box-shadow:0 1px 0 #3e1714}.center{text-align:center}.start{padding:15px 24px;border-radius:14px;background:#333;color:#fff;font-size:18px;font-weight:bold}.small{font-size:12px;margin-top:8px;color:#333}.flash{animation:flash .18s 2}@keyframes flash{50%{background:#d2d7bc}}@media(max-height:700px){.screen{min-height:280px;height:50dvh}.red{height:60px}.squirrel{font-size:60px}}
.screen:before{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 15% 14%,#f4e68a 0 3%,transparent 3.5%),
linear-gradient(180deg,transparent 0 66%,#5d8b55 67% 100%);opacity:.55;z-index:0}
.tree{position:absolute;bottom:0;font-size:54px;z-index:1;filter:saturate(1.3)}.t1{left:1%}.t2{left:13%;font-size:40px}.t3{right:12%;font-size:43px}.t4{right:1%}
.squirrel .body{display:inline-block;font-size:64px;line-height:1;filter:drop-shadow(2px 3px 0 #263628)}
.squirrel .basket{position:absolute;font-size:26px;left:42px;top:25px}
.nut{filter:drop-shadow(1px 2px 0 #263628) saturate(1.4)!important}
.hud{background:#d9e5b866;padding:3px 6px;border-radius:5px}
</style></head>
<body><main class="game"><h1>БУРУНДУК И ОРЕШКИ</h1><section class="screen" id="screen"><div class="hud"><span id="score">000</span><span id="miss">● ● ●</span></div><div class="lane l1"></div><div class="lane l2"></div><div class="lane l3"></div><div class="lane l4"></div><div class="tree t1">🌲</div><div class="tree t2">🌳</div><div class="tree t3">🌳</div><div class="tree t4">🌲</div><div class="squirrel" id="sq"><span class="body">🐿️</span><span class="basket">🧺</span></div><div class="msg" id="msg">БУРУНДУК И ОРЕШКИ<br><br>Нажми «ИГРА»</div></section><div class="controls"><div class="side"><button class="red" data-pos="0">↖</button><button class="red" data-pos="2">↙</button></div><div class="center"><button class="start" id="start">ИГРА</button><div class="small">Поймай орех в конце дорожки.<br>3 промаха — конец игры.</div></div><div class="side"><button class="red" data-pos="1">↗</button><button class="red" data-pos="3">↘</button></div></div></main>
<script>
const screen=document.getElementById('screen'),sq=document.getElementById('sq'),scoreEl=document.getElementById('score'),missEl=document.getElementById('miss'),msg=document.getElementById('msg');let playing=false,score=0,miss=0,pos=0,nut=null,timer=null,step=0,lane=0;const paths=[[[4,15],[16,21],[28,28],[39,36]],[[89,15],[77,21],[66,28],[57,36]],[[4,76],[16,69],[28,61],[39,53]],[[89,76],[77,69],[66,61],[57,53]]],sp=[[42,34],[58,34],[42,62],[58,62]];
function move(p){pos=p;let q=sp[p];sq.style.left=q[0]+'%';sq.style.top=q[1]+'%';const r=[-18,18,18,-18][p];const flip=[1,-1,1,-1][p];sq.style.transform='translate(-50%,-50%) rotate('+r+'deg) scaleX('+flip+')';sq.querySelector('.basket').style.transform='scaleX('+flip+')'}function update(){scoreEl.textContent=String(score).padStart(3,'0');missEl.textContent=Array(3).fill(0).map((_,i)=>i<3-miss?'●':'○').join(' ')}
function beep(f=500,d=.05){try{let A=window.AudioContext||window.webkitAudioContext,a=new A,o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='square';g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function spawn(){if(!playing)return;lane=Math.floor(Math.random()*4);step=0;nut=document.createElement('div');nut.className='nut';nut.textContent=['🌰','🌰','🌰','🍂'][Math.floor(Math.random()*4)];screen.appendChild(nut);advance()}
function advance(){if(!playing||!nut)return;let p=paths[lane][step];nut.style.left=p[0]+'%';nut.style.top=p[1]+'%';step++;timer=setTimeout(step>=4?resolve:advance,Math.max(step>=4?250:180,(step>=4?650:480)-score*4))}
function resolve(){if(pos===lane){score++;beep(760,.04);screen.classList.add('flash');setTimeout(()=>screen.classList.remove('flash'),200)}else{miss++;beep(150,.12)}nut.remove();nut=null;update();if(miss>=3)return end();timer=setTimeout(spawn,Math.max(200,600-score*5))}
function end(){playing=false;msg.style.display='flex';msg.innerHTML='ИГРА ОКОНЧЕНА<br><br>СЧЁТ: '+score+'<br><br>Нажми «ИГРА»';beep(100,.3)}
function start(){clearTimeout(timer);if(nut)nut.remove();score=0;miss=0;playing=true;move(0);update();msg.style.display='none';beep(500,.06);setTimeout(spawn,400)}
document.querySelectorAll('[data-pos]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(playing){move(+b.dataset.pos);beep(330,.025)}}));document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();start()});update();
</script></body></html>
