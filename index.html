*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}html,body{margin:0;width:100%;height:100%;background:#17191c;font-family:Arial,sans-serif;overflow:hidden}body{position:fixed;inset:0}.wrap{position:fixed;inset:0;width:100%;height:100%;display:flex;align-items:stretch;justify-content:stretch;padding:0}.device{position:relative;width:100%;height:100%;aspect-ratio:auto;background:linear-gradient(145deg,#f1dfb8,#cba870);border:5px solid #d52b22;border-radius:0;box-shadow:inset 0 0 0 4px #7c201b,0 15px 45px #0009;padding:0 12%}.brand{position:absolute;top:.6%;left:0;right:0;text-align:center;color:#bd271f;font-weight:1000;font-size:clamp(20px,4vw,46px);letter-spacing:2px}.sub{display:block;color:#31271d;font-size:.35em;letter-spacing:1px}.screen{position:relative;width:100%;height:100%;border:8px solid #2c3029;border-radius:15px;overflow:hidden;background:#aeb99b;box-shadow:inset 0 0 25px #26362688}.screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#26362612 4px),linear-gradient(#bac5a8,#96a68c);z-index:0}.hud{position:absolute;z-index:8;top:3%;left:4%;right:4%;display:flex;justify-content:space-between;font:bold clamp(13px,2vw,25px) monospace;color:#1f2b20}.forest{position:absolute;inset:0;z-index:1;opacity:.82;background:linear-gradient(transparent 58%,#71846c 59% 100%)}.pine{position:absolute;bottom:3%;width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:75px solid #4d6650;filter:drop-shadow(0 0 0 #334936)}.p1{left:5%}.p2{left:16%;transform:scale(.7)}.p3{right:6%}.p4{right:18%;transform:scale(.75)}.branch{position:absolute;height:7px;background:#3d4b36;border-radius:8px;z-index:2;width:40%}.b0{left:-1%;top:27%;transform:rotate(11deg)}.b1{right:-1%;top:27%;transform:rotate(-11deg)}.b2{left:-1%;top:70%;transform:rotate(-11deg)}.b3{right:-1%;top:70%;transform:rotate(11deg)}.catch{position:absolute;width:50px;height:22px;border:5px solid #34432f;background:#8b5a32;border-radius:50%;z-index:3}.c0{left:34%;top:32%}.c1{right:34%;top:32%}.c2{left:34%;top:60%}.c3{right:34%;top:60%}.nut{position:absolute;width:24px;height:29px;background:#98562c;border:4px solid #283327;border-radius:45% 45% 55% 55%;z-index:6}.nut:before{content:"";position:absolute;left:-4px;top:-6px;width:24px;height:9px;border:4px solid #283327;background:#59603b;border-radius:50%}.sq{position:absolute;width:78px;height:68px;z-index:5;transition:left .05s,top .05s,transform .05s}.tail{position:absolute;width:42px;height:56px;background:#a85a32;border:5px solid #283327;border-radius:70% 40% 65% 35%;left:0;top:7px;transform:rotate(-25deg)}.body{position:absolute;width:46px;height:48px;background:#c8763d;border:5px solid #283327;border-radius:50%;left:27px;top:18px}.head{position:absolute;width:36px;height:32px;background:#d88747;border:5px solid #283327;border-radius:50%;left:42px;top:1px}.ear{position:absolute;width:12px;height:16px;background:#c8763d;border:4px solid #283327;left:51px;top:-5px;border-radius:70%}.eye{position:absolute;width:5px;height:5px;background:#182019;border-radius:50%;left:65px;top:12px}.basket{position:absolute;width:25px;height:17px;background:#8b633b;border:4px solid #283327;border-radius:3px 3px 10px 10px;left:64px;top:36px}.side{position:absolute;top:13%;bottom:13%;width:10%;display:flex;flex-direction:column;justify-content:space-between;z-index:20}.left{left:1%}.right{right:1%}.key{width:100%;aspect-ratio:1;border-radius:50%;border:5px solid #661d18;background:radial-gradient(circle at 40% 30%,#f54a3e,#b31f19 70%);box-shadow:0 6px #571713;color:#fff;font-size:clamp(24px,4vw,48px);font-weight:1000;-webkit-tap-highlight-color:transparent}.key:active{transform:translateY(5px);box-shadow:0 1px #571713}.msg{position:absolute;inset:0;z-index:30;background:#aeb99be8;display:flex;align-items:center;justify-content:center;text-align:center;color:#1f2b20;font:bold clamp(18px,3vw,32px) monospace}.start{position:absolute;right:1.2%;bottom:1%;border:0;border-radius:10px;background:#343434;color:#fff;font-weight:900;padding:8px 14px;z-index:25}.logo{display:none;position:absolute;left:2%;bottom:4%;font:bold clamp(9px,1.4vw,16px) monospace;color:#3b2c21}.portrait{display:none}@media(orientation:portrait){.wrap{align-items:stretch;padding:0}.device{width:100vw;height:100dvh;aspect-ratio:auto;padding:13% 3% 20%}.brand{top:3%;font-size:8vw}.screen{height:100%}.side{top:auto;bottom:4%;height:16%;width:23%;flex-direction:row;gap:8px}.left{left:3%}.right{right:3%}.key{width:48%;height:auto}.start{right:43%;bottom:7%}.logo{display:none}}
.sq.laugh{animation:laugh .22s infinite alternate}@keyframes laugh{from{margin-top:0;filter:brightness(1)}to{margin-top:-9px;filter:brightness(1.25)}}
@supports(height:100svh){html,body,.wrap,.device{height:100svh}}@media(orientation:landscape){.device{padding-left:max(12%,env(safe-area-inset-left));padding-right:max(12%,env(safe-area-inset-right));}.screen{height:100%;}.brand{pointer-events:none}.side{top:12%;bottom:12%}} </style></head><body><div class="wrap"><main class="device"><div class="brand">АЙФОНИКА<span class="sub">БЕЛКА ЛОВИТ ОРЕШКИ</span></div><section class="screen" id="screen"><div class="hud"><span>ОЧКИ <b id="score">000</b></span><span>РЕКОРД <b id="best">000</b></span><span id="life">● ● ●</span></div><div class="forest"></div><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><i class="branch b0"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="catch c0"></i><i class="catch c1"></i><i class="catch c2"></i><i class="catch c3"></i><div class="sq" id="sq"><i class="tail"></i><i class="body"></i><i class="head"></i><i class="ear"></i><i class="eye"></i><i class="basket"></i></div><div class="msg" id="msg">АЙФОНИКА<br><br>Поверни iPhone горизонтально<br>и нажми «ИГРА»</div></section><div class="side left"><button class="key" data-p="0">↖</button><button class="key" data-p="2">↙</button></div><div class="side right"><button class="key" data-p="1">↗</button><button class="key" data-p="3">↘</button></div><button class="start" id="start">ИГРА</button><div class="logo">ОРЕШКИ ДЕЛАЮТ ДЕНЬ ЛУЧШЕ :)</div></main></div><script>
const S=document.getElementById('screen'),Q=document.getElementById('sq'),SC=document.getElementById('score'),BE=document.getElementById('best'),LI=document.getElementById('life'),M=document.getElementById('msg');let playing=0,score=0,miss=0,pos=0,nut,timer,step,lane,best=+(localStorage.getItem('aifonikaBest')||0);BE.textContent=String(best).padStart(3,'0');let idleTimer,laughing=0;const paths=[[[2,20],[13,24],[25,28],[35,33]],[[93,20],[82,24],[70,28],[60,33]],[[2,76],[13,71],[25,66],[35,60]],[[93,76],[82,71],[70,66],[60,60]]],spots=[[39,29],[61,29],[39,60],[61,60]],flip=[-1,1,-1,1],rot=[-10,10,10,-10];
function resetIdle(){clearTimeout(idleTimer);if(laughing){laughing=0;Q.classList.remove('laugh');}if(playing)idleTimer=setTimeout(laugh,1300)}function laugh(){if(!playing)return;laughing=1;Q.classList.add('laugh');beep(720,.07);setTimeout(()=>beep(900,.07),100);setTimeout(()=>beep(760,.08),200);idleTimer=setTimeout(laugh,1300)}function move(p){pos=p;resetIdle();let q=spots[p];Q.style.left=q[0]+'%';Q.style.top=q[1]+'%';Q.style.transform='translate(-50%,-50%) scaleX('+flip[p]+') rotate('+rot[p]+'deg)'}function ui(){SC.textContent=String(score).padStart(3,'0');LI.textContent=['● ● ●','● ● ○','● ○ ○','○ ○ ○'][miss]}let ac;function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();g.gain.value=.0001;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.01)}catch(e){}}function beep(f,d=.055){try{unlockAudio();let o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function spawn(){if(!playing)return;lane=Math.floor(Math.random()*4);step=0;nut=document.createElement('i');nut.className='nut';S.appendChild(nut);advance()}function advance(){if(!nut)return;let p=paths[lane][step];nut.style.left=p[0]+'%';nut.style.top=p[1]+'%';beep(260+step*35,.015);step++;timer=setTimeout(step>=4?resolve:advance,Math.max(170,450-score*4))}function resolve(){if(pos===lane){score++;beep(850,.06);if(score>best){best=score;localStorage.setItem('aifonikaBest',best);BE.textContent=String(best).padStart(3,'0')}}else{miss++;beep(120,.15)}nut.remove();nut=null;ui();if(miss>=3)return end();timer=setTimeout(spawn,Math.max(180,500-score*3))}function end(){playing=0;M.style.display='flex';M.innerHTML='КОНЕЦ ИГРЫ<br><br>'+String(score).padStart(3,'0')+' ОЧКОВ<br><br>ИГРА — ЕЩЁ РАЗ';beep(90,.3)}function start(){clearTimeout(timer);clearTimeout(idleTimer);if(nut)nut.remove();score=0;miss=0;playing=1;move(0);ui();M.style.display='none';beep(440,.05);setTimeout(spawn,350);resetIdle()}
async function immersive(){unlockAudio();try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();}catch(e){}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}}document.addEventListener('pointerdown',unlockAudio,{once:true});document.addEventListener('touchstart',unlockAudio,{once:true,passive:true});document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();if(playing){move(+b.dataset.p);beep(330,.03)}}));document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();immersive();start()});move(0);ui();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script></body></html>
