<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#171b20"><title>Белочка и орешки</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 10%,#38404a,#15181c 70%);display:flex;align-items:center;justify-content:center;font-family:system-ui,Arial;color:#33271b}.console{width:min(100vw,720px);padding:10px 12px 18px;background:linear-gradient(145deg,#f2dfb6,#cda86e);border:8px solid #b62d24;border-radius:28px;box-shadow:inset 0 0 0 4px #7b211c,0 18px 45px #0008}.title{text-align:center;font-weight:1000;color:#a42b22;font-size:clamp(24px,6vw,38px);letter-spacing:.5px;margin:2px 0 8px}.screen{position:relative;height:min(58dvh,500px);min-height:390px;overflow:hidden;border:9px solid #292d27;border-radius:17px;background:linear-gradient(#79c7df 0 44%,#b8df9d 44% 68%,#58915c 68%);box-shadow:inset 0 0 30px #183c3655}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#fff0 0 3px,#1737280b 4px);z-index:9}.sun{position:absolute;left:8%;top:10%;width:55px;height:55px;border-radius:50%;background:#ffe27b;box-shadow:0 0 25px #ffe27b99}.cloud{position:absolute;color:#fff9;font-size:42px;top:8%;right:12%}.ground{position:absolute;left:0;right:0;bottom:0;height:31%;background:linear-gradient(#4f8c54,#2f6d42)}.bush{position:absolute;bottom:2%;font-size:44px;z-index:1}.b1{left:1%}.b2{right:1%}.b3{left:12%;font-size:34px}.b4{right:13%;font-size:34px}.lane{position:absolute;width:43%;height:7px;background:#755130;border-radius:8px;box-shadow:0 2px #3e3423;z-index:2}.l0{left:-1%;top:24%;transform:rotate(13deg)}.l1{right:-1%;top:24%;transform:rotate(-13deg)}.l2{left:-1%;top:72%;transform:rotate(-13deg)}.l3{right:-1%;top:72%;transform:rotate(13deg)}.nest{position:absolute;width:48px;height:25px;border-radius:50%;background:#8d5b2e;border:4px solid #51341d;z-index:2}.n0{left:35%;top:31%}.n1{right:35%;top:31%}.n2{left:35%;top:59%}.n3{right:35%;top:59%}.hud{position:absolute;z-index:8;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;font:900 22px ui-monospace,monospace;background:#eff7c9cc;border:3px solid #456746;border-radius:10px;padding:5px 9px}.best{font-size:12px}.nut{position:absolute;width:30px;height:36px;z-index:6;transition:left .08s linear,top .08s linear;filter:drop-shadow(2px 3px 1px #0005)}.acorn{width:25px;height:29px;background:#a96325;border:3px solid #55341d;border-radius:48% 48% 55% 55%;position:relative;transform:rotate(8deg)}.acorn:before{content:"";position:absolute;left:-3px;top:-6px;width:25px;height:10px;background:#6b431f;border:3px solid #55341d;border-radius:50%}.acorn:after{content:"";position:absolute;width:4px;height:8px;background:#55341d;left:11px;top:-12px}.sq{position:absolute;width:92px;height:86px;z-index:5;transition:left .07s,top .07s,transform .07s;transform-origin:center}.tail{position:absolute;width:48px;height:65px;background:#bd6327;border:5px solid #4e301e;border-radius:70% 45% 65% 35%;left:1px;top:6px;transform:rotate(-30deg)}.body{position:absolute;width:53px;height:58px;background:#d47a31;border:5px solid #4e301e;border-radius:50% 48% 45% 45%;left:32px;top:22px}.head{position:absolute;width:43px;height:38px;background:#e58a3b;border:5px solid #4e301e;border-radius:50%;left:48px;top:6px}.ear{position:absolute;width:15px;height:19px;background:#d66e2e;border:4px solid #4e301e;left:60px;top:-2px;transform:rotate(-25deg);border-radius:70% 20%}.eye{position:absolute;width:6px;height:6px;background:#17120e;border-radius:50%;left:76px;top:18px}.arm{position:absolute;width:31px;height:12px;background:#d47a31;border:4px solid #4e301e;border-radius:10px;left:58px;top:42px;transform:rotate(-15deg)}.basket{position:absolute;width:31px;height:20px;border:4px solid #50351e;border-radius:4px 4px 12px 12px;background:#c9914b;left:74px;top:45px}.basket:before{content:"";position:absolute;width:22px;height:15px;border:3px solid #50351e;border-bottom:0;border-radius:20px 20px 0 0;left:1px;top:-14px}.msg{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:#193b36cc;color:#fff7d2;font-weight:900;font-size:25px;padding:35px}.controls{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:13px;align-items:center;margin-top:14px}.side{display:grid;gap:12px}.key{height:72px;border:4px solid #64211b;border-radius:50%;background:linear-gradient(#e34a3b,#ad271f);box-shadow:0 6px #551b17;color:#fff;font-size:31px;font-weight:1000;-webkit-tap-highlight-color:transparent}.key:active,.key.on{transform:translateY(5px);box-shadow:0 1px #551b17}.center{text-align:center}.start{border:0;border-radius:16px;background:#2e3235;color:#fff;padding:16px 25px;font-size:20px;font-weight:900;box-shadow:0 5px #17191b}.label{font-size:12px;margin-top:10px;font-weight:700}.pop{animation:pop .16s}@keyframes pop{50%{transform:scale(1.12)}}.shake{animation:shake .18s 2}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@media(max-height:760px){.screen{min-height:330px;height:53dvh}.key{height:62px}.sq{transform:scale(.9)}}
</style></head><body><main class="console"><div class="title">БЕЛОЧКА И ОРЕШКИ</div><section class="screen" id="screen"><div class="sun"></div><div class="cloud">☁</div><div class="ground"></div><div class="bush b1">🌲</div><div class="bush b2">🌲</div><div class="bush b3">🌳</div><div class="bush b4">🌳</div><div class="hud"><span id="score">000</span><span class="best">РЕКОРД <b id="best">000</b></span><span id="life">● ● ●</span></div><div class="lane l0"></div><div class="lane l1"></div><div class="lane l2"></div><div class="lane l3"></div><div class="nest n0"></div><div class="nest n1"></div><div class="nest n2"></div><div class="nest n3"></div><div class="sq" id="sq"><i class="tail"></i><i class="body"></i><i class="head"></i><i class="ear"></i><i class="eye"></i><i class="arm"></i><i class="basket"></i></div><div class="msg" id="msg">БЕЛОЧКА И ОРЕШКИ<br><br>Нажми «ИГРА»</div></section><div class="controls"><div class="side"><button class="key" data-p="0">↖</button><button class="key" data-p="2">↙</button></div><div class="center"><button class="start" id="start">ИГРА</button><div class="label">Лови орешки • 3 промаха</div></div><div class="side"><button class="key" data-p="1">↗</button><button class="key" data-p="3">↘</button></div></div></main>
<script>
const S=document.getElementById('screen'),Q=document.getElementById('sq'),SC=document.getElementById('score'),LI=document.getElementById('life'),BE=document.getElementById('best'),M=document.getElementById('msg');let play=0,score=0,miss=0,pos=0,nut=null,timer=0,step=0,lane=0,best=+(localStorage.getItem('nutbest')||0);BE.textContent=String(best).padStart(3,'0');
const paths=[[[2,18],[14,22],[26,27],[36,33]],[[92,18],[80,22],[68,27],[58,33]],[[2,77],[14,72],[26,66],[36,59]],[[92,77],[80,72],[68,66],[58,59]]],spots=[[38,28],[62,28],[38,58],[62,58]],rot=[-18,18,18,-18],flip=[1,-1,1,-1];
function move(p){pos=p;let q=spots[p];Q.style.left=q[0]+'%';Q.style.top=q[1]+'%';Q.style.transform='translate(-50%,-50%) rotate('+rot[p]+'deg) scaleX('+flip[p]+')'}
function ui(){SC.textContent=String(score).padStart(3,'0');LI.textContent=['● ● ●','● ● ○','● ○ ○','○ ○ ○'][miss]}
let AC;function beep(f=500,d=.04){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.035,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function spawn(){if(!play)return;lane=Math.floor(Math.random()*4);step=0;nut=document.createElement('div');nut.className='nut';nut.innerHTML='<div class="acorn"></div>';S.appendChild(nut);advance()}
function delay(){return Math.max(145,430-Math.floor(score/5)*18)}
function advance(){if(!play||!nut)return;let p=paths[lane][step];nut.style.left=p[0]+'%';nut.style.top=p[1]+'%';beep(260+step*35,.018);step++;timer=setTimeout(step>=4?resolve:advance,step>=4?Math.max(210,500-score*3):delay())}
function resolve(){if(pos===lane){score++;beep(900,.06);Q.classList.add('pop');setTimeout(()=>Q.classList.remove('pop'),170);if(navigator.vibrate)navigator.vibrate(20);if(score>best){best=score;localStorage.setItem('nutbest',best);BE.textContent=String(best).padStart(3,'0')}}else{miss++;beep(120,.15);S.classList.add('shake');setTimeout(()=>S.classList.remove('shake'),380);if(navigator.vibrate)navigator.vibrate([40,30,40])}nut.remove();nut=null;ui();if(miss>=3)return end();timer=setTimeout(spawn,Math.max(180,520-score*3))}
function end(){play=0;M.style.display='flex';M.innerHTML='ИГРА ОКОНЧЕНА<br><br>СЧЁТ '+String(score).padStart(3,'0')+'<br>РЕКОРД '+String(best).padStart(3,'0')+'<br><br>Нажми «ИГРА»';beep(100,.3)}
function start(){clearTimeout(timer);if(nut)nut.remove();score=0;miss=0;play=1;move(0);ui();M.style.display='none';beep(440,.05);setTimeout(()=>beep(660,.05),80);setTimeout(spawn,450)}
document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();if(play){move(+b.dataset.p);b.classList.add('on');setTimeout(()=>b.classList.remove('on'),90);beep(330,.018)}}));document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();start()});move(0);ui();
</script></body></html>
