ition:absolute;right:1.2%;bottom:1%;border:0;border-radius:10px;background:#343434;color:#fff;font-weight:900;padding:8px 14px;z-index:25}.logo{display:none;position:absolute;left:2%;bottom:4%;font:bold clamp(9px,1.4vw,16px) monospace;color:#3b2c21}.portrait{display:none}@media(orientation:portrait){.wrap{align-items:stretch;padding:0}.device{width:100vw;height:100dvh;aspect-ratio:auto;padding:13% 3% 20%}.brand{top:3%;font-size:8vw}.screen{height:100%}.side{top:auto;bottom:4%;height:16%;width:23%;flex-direction:row;gap:8px}.left{left:3%}.right{right:3%}.key{width:48%;height:auto}.start{right:43%;bottom:7%}.logo{display:none}}

</style></head><body><div class="wrap"><main class="device"><div class="brand">АЙФОНИКА DELUXE<span class="sub">БЕЛКА ЛОВИТ ОРЕШКИ</span></div><section class="screen" id="screen"><div class="hud"><span>ОЧКИ <b id="score">000</b></span><span>РЕКОРД <b id="best">000</b></span><span id="life">● ● ●</span></div><div class="forest"></div><i class="pine p1"></i><i class="pine p2"></i><i class="pine p3"></i><i class="pine p4"></i><i class="branch b0"></i><i class="branch b1"></i><i class="branch b2"></i><i class="branch b3"></i><i class="catch c0"></i><i class="catch c1"></i><i class="catch c2"></i><i class="catch c3"></i><div class="sq" id="sq"><i class="tail"></i><i class="body"></i><i class="head"></i><i class="ear"></i><i class="eye"></i><i class="basket"></i></div><div class="msg" id="msg">АЙФОНИКА DELUXE<br><br>Поверни iPhone горизонтально<br>и нажми «ИГРА»</div></section><div class="side left"><button class="key" data-p="0">↖</button><button class="key" data-p="2">↙</button></div><div class="side right"><button class="key" data-p="1">↗</button><button class="key" data-p="3">↘</button></div><button class="start" id="start">ИГРА</button><div class="logo">ОРЕШКИ ДЕЛАЮТ ДЕНЬ ЛУЧШЕ :)</div></main></div><script>
const S=document.getElementById('screen'),Q=document.getElementById('sq'),SC=document.getElementById('score'),BE=document.getElementById('best'),LI=document.getElementById('life'),M=document.getElementById('msg');let playing=0,score=0,miss=0,pos=0,nut,timer,step,lane,best=+(localStorage.getItem('aifonikaDeluxeBest')||0);BE.textContent=String(best).padStart(3,'0');let idleTimer,laughing=0;const paths=[[[2,20],[13,24],[25,28],[35,33]],[[93,20],[82,24],[70,28],[60,33]],[[2,76],[13,71],[25,66],[35,60]],[[93,76],[82,71],[70,66],[60,60]]],spots=[[39,29],[61,29],[39,60],[61,60]],flip=[-1,1,-1,1],rot=[-10,10,10,-10];
function resetIdle(){clearTimeout(idleTimer);if(laughing){laughing=0;Q.classList.remove('laugh');}if(playing)idleTimer=setTimeout(laugh,1300)}function laugh(){if(!playing)return;laughing=1;Q.classList.add('laugh');[760,980,820,1080,880].forEach((f,i)=>setTimeout(()=>beep(f,.055),i*72));if(navigator.vibrate)navigator.vibrate([15,35,15]);idleTimer=setTimeout(laugh,1300)}function move(p){pos=p;resetIdle();let q=spots[p];Q.style.left=q[0]+'%';Q.style.top=q[1]+'%';Q.style.transform='translate(-50%,-50%) scaleX('+flip[p]+') rotate('+rot[p]+'deg)'}function ui(){SC.textContent=String(score).padStart(3,'0');LI.textContent=['● ● ●','● ● ○','● ○ ○','○ ○ ○'][miss]}let ac;function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();g.gain.value=.0001;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.01)}catch(e){}}function beep(f,d=.055){try{unlockAudio();let o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function spawn(){if(!playing)return;lane=Math.floor(Math.random()*4);step=0;nut=document.createElement('i');nut.className='nut';S.appendChild(nut);advance()}function advance(){if(!nut)return;let p=paths[lane][step];nut.style.left=p[0]+'%';nut.style.top=p[1]+'%';beep(260+step*35,.015);step++;timer=setTimeout(step>=4?resolve:advance,Math.max(170,450-score*4))}function resolve(){if(pos===lane){score++;S.classList.remove('flash');void S.offsetWidth;S.classList.add('flash');if(navigator.vibrate)navigator.vibrate(18);beep(850,.06);if(score>best){best=score;localStorage.setItem('aifonikaBest',best);BE.textContent=String(best).padStart(3,'0')}}else{miss++;if(navigator.vibrate)navigator.vibrate([35,25,35]);beep(120,.15)}nut.remove();nut=null;ui();if(miss>=3)return end();timer=setTimeout(spawn,Math.max(180,500-score*3))}function end(){playing=0;M.style.display='flex';M.innerHTML='КОНЕЦ ИГРЫ<br><br>'+String(score).padStart(3,'0')+' ОЧКОВ<br><br>ИГРА — ЕЩЁ РАЗ';beep(90,.3)}function start(){clearTimeout(timer);clearTimeout(idleTimer);if(nut)nut.remove();score=0;miss=0;playing=1;move(0);ui();M.style.display='none';beep(440,.05);setTimeout(spawn,350);resetIdle()}
async function immersive(){unlockAudio();try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen();}catch(e){}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}}document.addEventListener('pointerdown',unlockAudio,{once:true});document.addEventListener('touchstart',unlockAudio,{once:true,passive:true});document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();if(playing){move(+b.dataset.p);beep(330,.03)}}));document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();immersive();start()});move(0);ui();
